name: Track Publishes
on:
  schedule:
    # */5 was aspirational, not real. GitHub does not honour a 5-minute schedule on a busy
    # org: the gaps between consecutive runs on 2026-09-14 were 11, 8, 7, 17, 26 and 16
    # minutes. Asking for every 5 minutes and getting every 7-26 made the cadence
    # unpredictable while still paying for ~12 runs an hour, most of which announced nothing.
    #
    # A 20-minute schedule is closer to what the scheduler actually delivers, and it shrinks
    # the boundary zone where a publish can land in two consecutive windows from 60s in every
    # 300s (~20% of publishes) to 60s in every 1200s (~5%). It does not fix that overlap -
    # the announced history below does - it just makes it rarer.
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      override_start_time:
        description: "ISO 8601 start of the window, e.g. 2026-09-08T07:00:00Z. Use to recover after an outage long enough that no successful run remains in the last 100."
        required: false
        type: string

permissions:
  actions: read # required to read this workflow's own run history
  contents: write # required for the repository dispatch event

# A scheduling backlog has to COLLAPSE, not drain.
#
# Actions capacity pressure at the org level regularly leaves this workflow queued for
# hours (measured: runs created 2026-09-07T23:25Z did not execute until 2026-09-08T11:48Z,
# a 12h delay). Every backlogged run resolves the same watermark, so draining N of them
# announces the same publish N times - which is exactly how one publish at 07:19Z became
# three Slack messages at 11:53Z, 12:46Z and 12:51Z.
#
# Keeping only the newest run costs nothing, because the watermark only advances on a
# successful run: the survivor's window still reaches back over the whole gap.
concurrency:
  group: track-publishes-${{ github.ref }}
  cancel-in-progress: true

env:
  ADD_MD_SUFFIX: "true" # append .md to extensionless paths, for compatibility with older consumers
  REPOSITORY_DISPATCH_EVENT: "resource-published-native"
  ROUTE_FILTER: "live" # 'live' or 'preview'
  AEM_API: "https://api.aem.live" # Helix 6 admin API; replaces admin.hlx.page
  AEM_ORG: "adobe"
  # The GitHub repo is helix-website, but the site serving www.aem.live - and therefore the
  # one publishes are logged against - is registered as aem-website. See CLAUDE.md.
  AEM_SITE: "aem-website"
  # Re-read this much before the watermark so a boundary publish is never lost. The admin log
  # is eventually consistent: an entry timestamped T only becomes visible some seconds later,
  # so a window starting exactly at the previous run's start would miss anything still in
  # flight. The cost is that the re-read window is announced twice - see ANNOUNCED_HISTORY_HOURS.
  OVERLAP_SECONDS: "60"
  WIDE_WINDOW_HOURS: "6" # warn above this, rather than silently narrowing the window
  # How long to remember what was already announced, so the re-read above cannot announce it
  # again. Must comfortably exceed WIDE_WINDOW_HOURS, or a run catching up after a gap will
  # re-announce everything it re-reads. Roughly 70 entries per 12h on this site, so the file
  # this produces stays a few KB.
  ANNOUNCED_HISTORY_HOURS: "12"
  # Refuse to read more than this many pages of admin log in one run. The log is paginated
  # with nextToken; a runaway loop is worse than a loud failure.
  MAX_LOG_PAGES: "20"
  # One logical publish can hit the admin log more than once seconds apart. Observed:
  # /docs/global.json appeared twice in run 34345742857 (timestamps 1788952659491 and
  # 1788952676113, 16.6s apart, same user and status 200). unique_by([ .path, .timestamp ])
  # cannot collapse them because the timestamps differ, so the channel got two identical
  # messages. A 120s window collapses a burst while preserving a deliberate re-publish
  # minutes later. The newest entry wins so the announcement reflects the final state.
  #
  # The same window is applied a second time against the announced history, so a burst split
  # across two runs collapses exactly like a burst seen within one run.
  COLLAPSE_SECONDS: "120"

# One job, not three. The three former jobs each paid their own queue wait, which under
# backlog pulled them minutes to hours apart: run 34221704920 resolved its watermark at
# 12:50:30Z and read the log at 13:28:13Z, 38 minutes later, so the window it reported on
# was not the window it had computed. Serial steps in one job cannot drift, and the job is
# billed once instead of three times.
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify the admin token
        env:
          TOKEN: ${{ secrets.AEM_LIVE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          RUNBOOK="https://github.com/${GITHUB_REPOSITORY}/blob/main/.github/admin-token.md"

          if [[ -z "$TOKEN" ]]; then
            echo "::error::The AEM_LIVE_ADMIN_TOKEN secret is not configured. See $RUNBOOK"
            exit 1
          fi

          # Admin API keys are JWTs, so the expiry can be read without calling the API.
          decode_base64_url() {
            local result="$1"
            case $((${#1} % 4)) in
              2) result="$1==" ;;
              3) result="$1=" ;;
            esac
            echo "$result" | tr '_-' '/+' | base64 -d
          }

          PAYLOAD=$(printf '%s' "$TOKEN" | cut -d '.' -f 2)
          EXPIRY=$(decode_base64_url "$PAYLOAD" 2>/dev/null | jq -r '.exp // empty' 2>/dev/null || true)

          if [[ -z "$EXPIRY" ]]; then
            echo "::error::AEM_LIVE_ADMIN_TOKEN is not a JWT with an exp claim. Mint an admin API key as described in $RUNBOOK"
            exit 1
          fi

          NOW=$(date +%s)
          echo "Token expires at: $(date -d "@$EXPIRY")"

          if [[ "$EXPIRY" -lt "$NOW" ]]; then
            {
              echo "### AEM_LIVE_ADMIN_TOKEN has expired"
              echo "It expired on $(date -d "@$EXPIRY"). Every run of this workflow will fail with a 401 until it is rotated."
              echo "Rotate it by following $RUNBOOK"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::AEM_LIVE_ADMIN_TOKEN expired on $(date -d "@$EXPIRY"). Rotate it: $RUNBOOK"
            exit 1
          fi

          if [[ "$EXPIRY" -lt "$((NOW + 7 * 24 * 60 * 60))" ]]; then
            {
              echo "### AEM_LIVE_ADMIN_TOKEN expires soon"
              echo "It expires on $(date -d "@$EXPIRY"). Rotate it by following $RUNBOOK"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::AEM_LIVE_ADMIN_TOKEN expires on $(date -d "@$EXPIRY"). Rotate it: $RUNBOOK"
          fi

      # The watermark is the creation time of the last successful run before this one.
      #
      # It is resolved from the UNFILTERED run list, filtered locally. Server-side
      # filtering of this endpoint is not reliable at this workflow's scale (35,600+ runs):
      # in 13 consecutive identical calls to ?status=completed&branch=main, one returned
      # total_count=29346 with a newest run of 2026-08-17 - three weeks stale - and zero
      # successful runs anywhere on the page. The unfiltered list was stable and correctly
      # ordered in 8/8 calls. A poisoned response used to send `from` hours off in either
      # direction, which both duplicated and DROPPED publishes: the run created at
      # 07:59:23Z resolved from=11:58:54Z and skipped four hours of log outright.
      #
      # Same finding, same fix as adobe/aem-certificate-rotation#43.
      - name: Resolve the window
        id: window
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERRIDE_START_TIME: ${{ inputs.override_start_time }}
        run: |
          set -euo pipefail

          WORKFLOW_FILE=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Workflow file: $WORKFLOW_FILE (branch $BRANCH)"

          # No status= or branch= here, deliberately. Both are filtered locally below.
          RUNS=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?per_page=100")

          LAST_SUCCESS=$(printf '%s' "$RUNS" | jq -r \
            --arg branch "$BRANCH" \
            --argjson self "${GITHUB_RUN_ID}" '
              [ .workflow_runs[]
                | select(.head_branch == $branch)
                | select(.conclusion == "success")
                | select(.id != $self)
                | .created_at ]
              | max // empty')

          if [[ -n "$OVERRIDE_START_TIME" ]]; then
            echo "::notice::Using override_start_time=$OVERRIDE_START_TIME"
            WINDOW_START="$OVERRIDE_START_TIME"
          elif [[ -n "$LAST_SUCCESS" ]]; then
            WINDOW_START="$LAST_SUCCESS"
            echo "Last successful run: $LAST_SUCCESS"
          else
            # Fail closed. The previous version fell back to "5 minutes ago", which turns a
            # lost watermark into silently unannounced publishes - a wrong answer that looks
            # like a clean run. An operator can widen the window deliberately with
            # override_start_time.
            {
              echo "### Track Publishes could not resolve a watermark"
              echo "No successful run of \`$WORKFLOW_FILE\` on \`$BRANCH\` in the last 100 runs."
              echo "Re-run this workflow manually with \`override_start_time\` set to the ISO 8601 time"
              echo "publishes should be announced from, e.g. \`$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No successful run found in the last 100; refusing to guess a window. Re-run with override_start_time."
            exit 1
          fi

          START_EPOCH=$(date -u -d "$WINDOW_START" +%s)
          FROM_EPOCH=$((START_EPOCH - OVERLAP_SECONDS))
          FROM=$(date -u -d "@$FROM_EPOCH" +%Y-%m-%dT%H:%M:%SZ)

          AGE_HOURS=$(( ($(date +%s) - START_EPOCH) / 3600 ))
          if [[ "$AGE_HOURS" -ge "$WIDE_WINDOW_HOURS" ]]; then
            echo "::warning::Window is ${AGE_HOURS}h wide (from $FROM). Expected ~20min - this run is catching up after a gap."
          fi

          {
            echo "from=$FROM"
            echo "from-ms=$((FROM_EPOCH * 1000))"
          } >> "$GITHUB_OUTPUT"
          echo "Window: $FROM -> now"

      # Carried between runs so the OVERLAP_SECONDS re-read cannot announce a publish twice.
      # restore-keys is a prefix match that returns the most recently created matching cache,
      # so every run picks up its predecessor's file. The exact key is unique per run and is
      # therefore always a miss on restore, which is precisely what makes the save at the end
      # of the job valid - actions/cache refuses to overwrite an existing key.
      - name: Restore the announced history
        uses: actions/cache/restore@v4
        with:
          path: announced-history.ndjson
          key: track-publishes-announced-${{ github.run_id }}
          restore-keys: |
            track-publishes-announced-

      - name: Read the publish log
        id: log
        env:
          ADMIN_TOKEN: ${{ secrets.AEM_LIVE_ADMIN_TOKEN }}
          FROM: ${{ steps.window.outputs.from }}
          FROM_MS: ${{ steps.window.outputs.from-ms }}
        run: |
          set -euo pipefail

          FROM_PARAM=$(printf '%s' "$FROM" | jq -sRr @uri)
          BASE_URL="${AEM_API}/${AEM_ORG}/sites/${AEM_SITE}/log?from=${FROM_PARAM}"

          # The admin log is paginated: getLogs returns a nextToken when the window does not
          # fit in one response. Reading only the first page silently drops the remainder,
          # which is the worst failure mode this workflow has - a quiet channel is
          # indistinguishable from a healthy one. Not currently triggered at this site's
          # volume (a 24h window returns ~142 entries and no token), but a bulk publish or a
          # WIDE_WINDOW_HOURS catch-up can reach it, and the 20-minute schedule makes each
          # window wider than it used to be.
          : > pages.ndjson
          NEXT=""
          PAGE=1
          while :; do
            if [[ -n "$NEXT" ]]; then
              URL="${BASE_URL}&nextToken=$(printf '%s' "$NEXT" | jq -sRr @uri)"
            else
              URL="$BASE_URL"
            fi
            echo "GET $URL"

            HTTP_STATUS=$(curl --http1.1 -sS -o page.json -w '%{http_code}' \
              -H "Authorization: token $(printf '%s' "$ADMIN_TOKEN" | tr -d '\n')" \
              -H "Accept: application/json" \
              -H "User-Agent: GitHub-Actions-Workflow" \
              "$URL")

            if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -gt 299 ]]; then
              echo "::error::Admin log request failed with HTTP $HTTP_STATUS on page $PAGE"
              head -c 2000 page.json
              exit 1
            fi

            jq -c '.entries[]?' page.json >> pages.ndjson

            NEXT=$(jq -r '.nextToken // empty' page.json)
            [[ -n "$NEXT" ]] || break

            PAGE=$((PAGE + 1))
            if [[ "$PAGE" -gt "$MAX_LOG_PAGES" ]]; then
              echo "::error::Admin log still paginating after $MAX_LOG_PAGES pages; refusing to loop further. Narrow the window with override_start_time."
              exit 1
            fi
          done

          if [[ "$PAGE" -gt 1 ]]; then
            echo "Read $PAGE pages of admin log"
          fi

          # Reassembled into the single-response shape so every filter below is unchanged.
          jq -c -s '{ entries: . }' pages.ndjson > body.json

          # The window is enforced HERE, not by trusting the query. An admin API that ignored
          # `from` would otherwise replay its whole retention window as "just published".
          # This is a warning rather than a hard failure precisely because the local filter
          # already makes the result correct either way.
          STALE=$(jq --argjson floor "$FROM_MS" '[ .entries[]? | select((.timestamp // 0) < $floor) ] | length' body.json)
          if [[ "$STALE" -gt 0 ]]; then
            echo "::warning::The admin API returned $STALE entries older than from=$FROM; it may be ignoring the parameter. They are being filtered out locally."
          fi

          # Flatten .path + .paths[], drop anything outside the window or off-route, and
          # collapse duplicates. unique_by is a second line of defence behind the
          # concurrency group: a run cancelled mid-dispatch does not advance the watermark,
          # so its successor re-reads the same entries.
          #
          # The collapse step groups by path, user and status, then within each group keeps
          # only entries whose timestamps are more than COLLAPSE_SECONDS apart. This handles the
          # admin log recording a single logical publish multiple times seconds apart
          # (see the COLLAPSE_SECONDS comment above). The pre-collapse result is written
          # to all.ndjson so that dropped entries remain visible in the run log.
          jq -c --arg route "$ROUTE_FILTER" --argjson floor "$FROM_MS" '
            [ .entries[]?
              | select(.route == $route)
              | select((.timestamp // 0) >= $floor)
              | { user: (.user // "unknown"), timestamp: .timestamp, status: .status,
                  paths: ([ .path ] + (.paths // [])) }
              | . as $entry
              | $entry.paths[]
              | select(. != null and . != "")
              | { path: ., user: $entry.user, timestamp: $entry.timestamp, status: $entry.status } ]
            | unique_by([ .path, .timestamp ])
            | sort_by(.timestamp)
            | .[]' body.json > all.ndjson

          # Collapse a burst of identical entries into the newest one. The key is path + user
          # + status, not path alone: two people publishing the same path inside the window are
          # two real announcements, and a success followed by a failure must not be masked.
          # Reads all.ndjson so the extraction filter above stays the single source of truth for
          # both files, with no second copy to drift out of step with it.
          jq -c -s --argjson collapse_ms "$(( COLLAPSE_SECONDS * 1000 ))" '
            group_by([ .path, .user, .status ])
            | map(
                sort_by(.timestamp)
                | reverse
                | reduce .[] as $e ([];
                    if (length == 0) or ((.[-1].timestamp - $e.timestamp) > $collapse_ms)
                    then . + [$e]
                    else . end)
              )
            | flatten
            | sort_by(.timestamp)
            | .[]' all.ndjson > publishes.ndjson

          # Everything above dedupes within one run's batch, which cannot help when two runs
          # read the same publish. On 2026-09-14 the publish of /developer/github-actions at
          # 11:54:20Z was announced by run 34840599014 (window from 11:46:26Z) and announced
          # again by run 34842067703, whose window opened at 11:53:48Z - the previous run's
          # start minus OVERLAP_SECONDS. The publish had landed 28s before that earlier run
          # started, so the later run's 60s re-read reached back over it. The two messages were
          # 16m47s apart in separate processes, so no amount of in-batch grouping could see it.
          #
          # announced-history.ndjson holds what earlier runs actually dispatched, restored from
          # cache. A candidate is dropped if the history already holds that exact log entry, or
          # one for the same path, user and status within COLLAPSE_SECONDS - the same rule the
          # in-batch collapse uses, so a burst split across two runs behaves like a burst inside
          # one. A cache miss degrades to the old duplicate-announcing behaviour rather than to
          # silence, which is the right direction for this to fail in.
          touch announced-history.ndjson
          jq -c -s --argjson collapse_ms "$(( COLLAPSE_SECONDS * 1000 ))" \
            --slurpfile history announced-history.ndjson '
            ( $history | map(select(type == "object")) ) as $h
            | .[]
            | . as $candidate
            | ( $h
                | map(select(
                    .path == $candidate.path
                    and .user == $candidate.user
                    and .status == $candidate.status
                    and ( .timestamp == $candidate.timestamp
                          or ( ($candidate.timestamp - .timestamp)
                               | if . < 0 then - . else . end ) <= $collapse_ms )))
                | length ) as $already
            | select($already == 0)' publishes.ndjson > announce.ndjson

          ALL_COUNT=$(wc -l < all.ndjson | tr -d ' ')
          COLLAPSED_COUNT=$(wc -l < publishes.ndjson | tr -d ' ')
          HISTORY_COUNT=$(wc -l < announced-history.ndjson | tr -d ' ')
          COUNT=$(wc -l < announce.ndjson | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Announced history holds $HISTORY_COUNT entr(y|ies)"
          echo "Publishes to announce: $COUNT"
          if [[ "$ALL_COUNT" -ne "$COLLAPSED_COUNT" ]]; then
            COLLAPSED=$((ALL_COUNT - COLLAPSED_COUNT))
            echo "Collapsed $COLLAPSED duplicate entr(y|ies) with the same path, user and status within ${COLLAPSE_SECONDS}s"
            echo "Pre-collapse entries:"
            cat all.ndjson
          fi
          if [[ "$COLLAPSED_COUNT" -ne "$COUNT" ]]; then
            SUPPRESSED=$((COLLAPSED_COUNT - COUNT))
            echo "Suppressed $SUPPRESSED entr(y|ies) already announced by an earlier run"
            echo "Candidates before suppression:"
            cat publishes.ndjson
          fi
          cat announce.ndjson

      - name: Announce publishes
        if: steps.log.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          : > dispatched.ndjson

          while IFS= read -r entry; do
            [[ -n "$entry" ]] || continue

            path=$(printf '%s' "$entry" | jq -r '.path')

            # Only extensionless paths get .md; a published .png keeps its own extension.
            if [[ "$ADD_MD_SUFFIX" == "true" && "$path" != *.* ]]; then
              path="${path}.md"
            fi

            payload=$(printf '%s' "$entry" | jq \
              --arg type "$REPOSITORY_DISPATCH_EVENT" \
              --arg path "$path" '
                { event_type: $type,
                  client_payload: {
                    path: $path,
                    user: .user,
                    timestamp: .timestamp,
                    status: .status } }')

            echo "Dispatching $REPOSITORY_DISPATCH_EVENT for $path"
            printf '%s' "$payload" | gh api \
              --method POST \
              --header "Accept: application/vnd.github.v3+json" \
              "/repos/${GITHUB_REPOSITORY}/dispatches" \
              --input -

            # Recorded only after the dispatch returns. If the loop dies part way through the
            # list, the entries that did go out are remembered and the rest stay eligible.
            printf '%s\n' "$entry" >> dispatched.ndjson
          done < announce.ndjson

      # Written even when an earlier step failed: anything already dispatched has reached Slack
      # and must never be announced again. Skipped only when the log step never produced a
      # history file to update.
      - name: Update the announced history
        if: always() && steps.log.outcome == 'success'
        run: |
          set -euo pipefail

          touch announced-history.ndjson dispatched.ndjson

          # Pruned to ANNOUNCED_HISTORY_HOURS so the file cannot grow without bound. The cutoff
          # has to stay wider than WIDE_WINDOW_HOURS, or a run catching up after a long gap
          # would re-read entries the history has already forgotten and announce them again.
          CUTOFF_MS=$(( ( $(date -u +%s) - ANNOUNCED_HISTORY_HOURS * 3600 ) * 1000 ))

          cat announced-history.ndjson dispatched.ndjson \
            | jq -c -s --argjson cutoff "$CUTOFF_MS" '
                map(select(type == "object" and (.timestamp // 0) >= $cutoff))
                | unique_by([ .path, .user, .status, .timestamp ])
                | sort_by(.timestamp)
                | .[]' > announced-history.next.ndjson

          mv announced-history.next.ndjson announced-history.ndjson

          ADDED=$(wc -l < dispatched.ndjson | tr -d ' ')
          KEPT=$(wc -l < announced-history.ndjson | tr -d ' ')
          echo "Recorded $ADDED newly announced entr(y|ies); history now holds $KEPT within ${ANNOUNCED_HISTORY_HOURS}h"

      # Saved on every run, not only when something was announced, so the newest cache key stays
      # recent. Caches are evicted after 7 days without a hit, and restore-keys resolves to the
      # most recent match, so a quiet week must not be allowed to age the history out.
      - name: Save the announced history
        if: always() && steps.log.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: announced-history.ndjson
          key: track-publishes-announced-${{ github.run_id }}
