<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Agenda card on dawn</title>
  <link rel="stylesheet" href="../lib/aem-live.css">
  <script type="module" src="../lib/aem-live.js"></script>
</head>
<body>
  <aem-slide bg="dawn">
    <aem-checker tone="graphite" style="left:40%; top:0; right:0; height:57%"></aem-checker>
    <aem-card align="start" style="--w:760px; --h:520px; --r:96px; --pad:56px 72px; --gap:26px">
      <p class="aem-kicker" style="color:var(--olive)">Agenda</p>
      <ol class="aem-list" style="--marker:var(--olive)">
        <li>Why documents are the best CMS</li>
        <li>Blocks, sections and metadata</li>
        <li>Previews, publishing and the CDN</li>
        <li>Measuring what matters with RUM</li>
      </ol>
    </aem-card>
    <aem-badge icon="calendar" style="--x:830px; --y:150px; --icon:56%"></aem-badge>
  </aem-slide>
</body>
</html>
