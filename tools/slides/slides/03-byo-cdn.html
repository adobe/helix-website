<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bring your own CDN — three tiles</title>
  <link rel="stylesheet" href="../lib/aem-live.css">
  <script type="module" src="../lib/aem-live.js"></script>
</head>
<body>
  <aem-slide bg="lavender" grid="medium">
    <div class="aem-text" style="--y:150px">
      <h2 class="aem-h2" style="color:var(--plum)">Bring your own CDN</h2>
    </div>
    <aem-tile tone="white" style="--size:236px; --x:222px; --y:450px">
      <aem-icon name="cloudflare-cloud" style="--size:72%"></aem-icon>
    </aem-tile>
    <aem-tile tone="white" style="--size:236px; --x:512px; --y:450px">
      <aem-icon name="fastly" style="--size:78%; color:var(--fastly)"></aem-icon>
      <aem-badge at="tr" icon="gear-badge" style="--size:104px"></aem-badge>
    </aem-tile>
    <aem-tile tone="white" style="--size:236px; --x:802px; --y:450px">
      <aem-icon name="aws" style="--size:58%"></aem-icon>
    </aem-tile>
  </aem-slide>
</body>
</html>
