<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Night — stopwatch tile with bolt badge</title>
  <link rel="stylesheet" href="../lib/aem-live.css">
  <script type="module" src="../lib/aem-live.js"></script>
</head>
<body>
  <aem-slide bg="night" grid="large">
    <aem-tile tone="silver">
      <aem-icon name="stopwatch" style="--size:58%; color:#2c2a5c"></aem-icon>
      <aem-badge at="tr" tone="night" icon="bolt" style="--icon:44%; --badge-ink:var(--lime)"></aem-badge>
    </aem-tile>
    <div class="aem-text on-dark" style="--y:668px">
      <p class="aem-h3">100 Lighthouse, every page, every deploy</p>
    </div>
  </aem-slide>
</body>
</html>
