<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TITLE — one line, shows up in the gallery</title>
  <link rel="stylesheet" href="../lib/aem-live.css">
  <script type="module" src="../lib/aem-live.js"></script>
</head>
<body>
  <!-- 1024×768 slide. Pick a bg, optionally a grid, then place objects with --x/--y (centre point). -->
  <aem-slide bg="sorbet">
    <aem-tile tone="graphite" glyph="lock">
      <aem-badge at="bl" emoji>🔑</aem-badge>
    </aem-tile>
  </aem-slide>
</body>
</html>
