<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Webhook B — published doc fires into the webhook (aem.live/developer/webhook hero)</title>
  <link rel="stylesheet" href="../lib/aem-live.css">
  <script type="module" src="../lib/aem-live.js"></script>
</head>
<body>
  <aem-slide bg="lavender" grid="medium">
    <svg viewBox="0 0 180 300" style="position:absolute; left:426px; top:50%; width:180px; height:300px; translate:0 -50%; z-index:1">
      <defs><linearGradient id="wedge" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#b9bcf6"/><stop offset="1" stop-color="#6870ec" stop-opacity=".9"/></linearGradient></defs>
      <polygon points="0,0 180,108 180,192 0,300" fill="url(#wedge)"/>
    </svg>
    <aem-tile tone="white" style="--x:264px">
      <aem-icon name="doc" style="--size:46%; color:var(--graphite)"></aem-icon>
      <aem-badge at="bl" emoji>🚀</aem-badge>
    </aem-tile>
    <aem-tile tone="ink" style="--x:766px">
      <aem-icon name="webhook" style="--size:62%; color:#fff"></aem-icon>
      <aem-badge at="tr" icon="stopwatch" style="--icon:48%"></aem-badge>
    </aem-tile>
  </aem-slide>
</body>
</html>
